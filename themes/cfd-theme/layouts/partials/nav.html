<nav class="nav" id="site-nav" aria-label="Site navigation">
  <a href="/" class="nav__logo" aria-label="{{ .Site.Params.author }} home">
    <!-- Fluid vortex logo mark -->
    <svg class="nav__logo-icon" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="18" cy="18" r="17" stroke="rgba(0,212,255,0.3)" stroke-width="1"/>
      <path d="M18 6 C24 6 30 12 28 18 C26 24 20 28 14 26 C8 24 6 18 10 13 C13 9 18 10 20 14 C22 18 18 22 14 20 C11 18 12 14 15 13" stroke="#00d4ff" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <circle cx="18" cy="18" r="2.5" fill="#00d4ff" opacity="0.7"/>
    </svg>
    <span>Ananth Narayan</span>
  </a>

  <ul class="nav__links" role="list">
    {{ range .Site.Menus.main }}
    <li>
      <a href="{{ .URL }}" class="nav__link{{ if or (eq $.RelPermalink .URL) (and (ne .URL "/") (hasPrefix $.RelPermalink .URL)) }} nav__link--active{{ end }}">
        {{ .Name }}
      </a>
    </li>
    {{ end }}
  </ul>

  <a href="{{ .Site.Params.github }}" class="nav__cta" target="_blank" rel="noopener noreferrer">GitHub ↗</a>

  <button class="nav__hamburger" id="nav-hamburger" aria-label="Toggle menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
</nav>

<div class="nav__mobile" id="nav-mobile" role="navigation" aria-label="Mobile navigation">
  {{ range .Site.Menus.main }}
  <a href="{{ .URL }}" class="nav__link">{{ .Name }}</a>
  {{ end }}
  <a href="{{ $.Site.Params.github }}" class="nav__link" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
</div>
