{{ define "main" }}
<div style="padding-top:calc(68px + 4rem);padding-bottom:6rem;">
  <div class="container">
    <div class="about-layout">

      <!-- Sidebar: photo + links -->
      <aside class="about-photo">
        <div class="about-photo__frame">
          {{ if .Params.photo }}
          <img src="{{ .Params.photo }}" alt="{{ .Site.Params.author }}" style="width:100%;height:100%;object-fit:cover;">
          {{ else }}
          <div class="about-photo__placeholder">
            <span style="font-size:3rem;">👤</span>
            <span>Photo placeholder</span>
            <span style="font-size:0.7rem;opacity:0.5;">300 × 400 px recommended</span>
          </div>
          {{ end }}
        </div>
        <div class="about-links">
          <a href="{{ .Site.Params.github }}" class="about-link" target="_blank" rel="noopener noreferrer">
            <span>GitHub</span><span style="margin-left:auto;color:var(--text-muted);">↗</span>
          </a>
          <a href="mailto:{{ .Site.Params.email }}" class="about-link">
            <span>Email</span><span style="margin-left:auto;color:var(--text-muted);">↗</span>
          </a>
          <a href="/publications/" class="about-link">
            <span>Publications</span><span style="margin-left:auto;color:var(--text-muted);">→</span>
          </a>
          <a href="/contact/" class="about-link">
            <span>Contact</span><span style="margin-left:auto;color:var(--text-muted);">→</span>
          </a>
        </div>
      </aside>

      <!-- Main content -->
      <div class="about-content">
        {{ .Content }}
      </div>

    </div>
  </div>
</div>
{{ end }}
