baseURL = 'https://ananth-narayan-iitm.github.io/'
languageCode = 'en-us'
title = 'Ananth Narayan | CFD & Optimization'
theme = 'cfd-theme'
enableRobotsTXT = true
enableGitInfo = false

[params]
  description = "Computational Fluid Dynamics researcher at IIT Madras — simulating flows, optimizing forms."
  author = "Ananth Narayan"
  institution = "IIT Madras"
  github = "https://github.com/Ananth-Narayan-IITM"
  email = "am24d038@smail.iitm.ac.in"
  keywords = ["CFD", "OpenFOAM", "DAFoam", "Basilisk", "aerodynamics", "optimization", "IIT Madras"]

[markup]
  [markup.highlight]
    style = "monokai"
    lineNos = false
    noClasses = true
  [markup.goldmark.renderer]
    unsafe = true
  # Passthrough: stop goldmark from treating _ and * inside math blocks as markdown
  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block  = [['$$', '$$']]
      inline = [['$',  '$' ]]

[menu]
